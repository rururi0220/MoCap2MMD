name: Build Multi-Platform Release (Windows, macOS, Linux)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable
        run: |
          python -m PyInstaller MoCap2MMD.spec --noconfirm --clean

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoCap2MMD-Windows-x64
          path: dist/MoCap2MMD.exe

  build-macos:
    name: Build macOS DMG & App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller pyobjc-framework-WebKit

      - name: Build macOS App & DMG
        run: |
          chmod +x scripts/build_macos.sh
          bash scripts/build_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoCap2MMD-macOS
          path: |
            dist/MoCap2MMD-macOS.dmg
            dist/MoCap2MMD-macOS.zip

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system WebKit and GTK libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libfuse2 \
            wget \
            file \
            desktop-file-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller pygobject

      - name: Build Linux AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          bash scripts/build_appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoCap2MMD-Linux-AppImage
          path: dist/MoCap2MMD-x86_64.AppImage

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: MoCap2MMD ${{ steps.vars.outputs.tag }}
          body: |
            ## MoCap2MMD Multi-Platform Release

            ### Downloads:
            - **Windows**: `MoCap2MMD.exe` (Standalone 64-bit Executable)
            - **macOS**: `MoCap2MMD-macOS.dmg` / `MoCap2MMD-macOS.zip` (Universal App Bundle)
            - **Linux**: `MoCap2MMD-x86_64.AppImage` (Self-contained AppImage)

            ### Features:
            - FBX / BVH to MMD VMD Motion Retargeting.
            - Real-time Three.js WebGL 3D preview with PMX model & motion rendering.
            - Full leg & foot IK solving, twist bone separation, finger FK retargeting.
            - Real-time "全ての親" root rotation and motion scale adjustments.
          files: |
            artifacts/MoCap2MMD-Windows-x64/MoCap2MMD.exe
            artifacts/MoCap2MMD-macOS/MoCap2MMD-macOS.dmg
            artifacts/MoCap2MMD-macOS/MoCap2MMD-macOS.zip
            artifacts/MoCap2MMD-Linux-AppImage/MoCap2MMD-x86_64.AppImage
          draft: false
          prerelease: false
